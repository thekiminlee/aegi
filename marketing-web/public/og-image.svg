  <!-- wordmark -->
  <text x="92" y="312" font-family="Georgia, 'Times New Roman', serif" font-style="italic"
        font-size="190" font-weight="700" fill="#1C1C1E">aegi</text>

  <!-- tagline -->
  <text x="100" y="404" font-family="Helvetica, Arial, sans-serif" font-size="33"
        fill="#555555">A calm tracker for feeds, sleep, diapers &amp; growth.</text>
  <text x="100" y="452" font-family="Helvetica, Arial, sans-serif" font-size="33"
        fill="#555555">Contraction timer &#183; kick counter &#183; private journal.</text>

  <!-- early access pill -->
  <rect x="100" y="486" width="296" height="56" rx="28" fill="#E8A893"/>
  <text x="248" y="521" font-family="Helvetica, Arial, sans-serif" font-size="22"
