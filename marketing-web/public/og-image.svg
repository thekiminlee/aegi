<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#FAF9F7"/>

  <!-- soft decorative shapes -->
  <circle cx="1170" cy="80" r="320" fill="#E8A893" opacity="0.16"/>
  <circle cx="60" cy="600" r="200" fill="#C5CDB8" opacity="0.20"/>

  <!-- eyebrow -->
  <circle cx="100" cy="132" r="6" fill="#D9937F"/>
  <text x="120" y="138" font-family="Helvetica, Arial, sans-serif" font-size="22"
