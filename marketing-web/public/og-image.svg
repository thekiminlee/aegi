  <!-- phone -->
  <rect x="842" y="64" width="294" height="502" rx="48" fill="#1C1C1E"/>
  <rect x="854" y="76" width="270" height="478" rx="38" fill="#FAF9F7"/>

  <!-- phone header -->
  <circle cx="890" cy="124" r="9" fill="#7FA8D4"/>
  <rect x="906" y="116" width="70" height="16" rx="8" fill="#E4E1DC"/>

  <!-- tiles -->
  <g>
    <rect x="878" y="160" width="106" height="106" rx="16" fill="#FFFFFF" stroke="#ECE9E4"/>
    <circle cx="958" cy="186" r="9" fill="#6FB1AC"/>
    <rect x="894" y="232" width="56" height="14" rx="7" fill="#E4E1DC"/>

    <rect x="994" y="160" width="106" height="106" rx="16" fill="#FFFFFF" stroke="#ECE9E4"/>
    <circle cx="1074" cy="186" r="9" fill="#8DAA5C"/>
    <rect x="1010" y="232" width="56" height="14" rx="7" fill="#E4E1DC"/>

    <rect x="878" y="278" width="106" height="106" rx="16" fill="#FFFFFF" stroke="#ECE9E4"/>
    <circle cx="958" cy="304" r="9" fill="#8A9B8E"/>
    <rect x="894" y="350" width="56" height="14" rx="7" fill="#E4E1DC"/>

    <rect x="994" y="278" width="106" height="106" rx="16" fill="#FFFFFF" stroke="#ECE9E4"/>
    <circle cx="1074" cy="304" r="9" fill="#E0A23D"/>
    <rect x="1010" y="350" width="56" height="14" rx="7" fill="#E4E1DC"/>
