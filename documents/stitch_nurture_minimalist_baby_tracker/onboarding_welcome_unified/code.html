<body class="font-body-default text-on-background flex flex-col items-center justify-between relative overflow-hidden">
<!-- Decorative Soft Background Element from Screen 17 -->
<div class="absolute top-0 left-0 w-full h-96 bg-gradient-to-b from-white to-transparent opacity-60 pointer-events-none z-0"></div>
<!-- Top Safe Area / Step Indicator - Restyled to match Screen 17 -->
<header class="w-full max-w-md px-safe-margin pt-xl pb-sm flex items-center justify-between z-10">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full bg-surface shadow-ambient text-on-surface-variant active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[20px]">arrow_back</span>
</button>
<div class="flex gap-2">
<div class="w-8 h-1.5 rounded-full bg-primary-container"></div>
<div class="w-8 h-1.5 rounded-full bg-primary-container"></div>
<div class="w-8 h-1.5 rounded-full bg-primary-container"></div>
</div>
<div class="w-10 h-10"></div> <!-- Spacer -->
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-md px-safe-margin flex-1 flex flex-col items-center justify-center z-10 mb-8">

<div class="relative w-full flex flex-col items-center justify-center py-lg mb-lg">
<div class="absolute inset-0 soft-blur-bg -z-10"></div>
<div class="relative w-56 h-56 flex items-center justify-center">
<div class="absolute top-0 right-0 w-32 h-32 bg-accent-diaper/20 rounded-full blur-2xl"></div>
<div class="absolute bottom-4 left-0 w-40 h-40 bg-accent-feed/15 rounded-full blur-3xl"></div>

<div class="absolute bottom-0 left-0 right-0 h-1/3 bg-gradient-to-t from-white/60 to-transparent"></div>
<div class="absolute bottom-3 flex gap-2">
<span class="material-symbols-outlined text-accent-contraction" style="font-variation-settings: 'FILL' 1;">favorite</span>
</div>
</div>
</div>
</div>
<!-- Welcoming Message - Typography aligned with Screen 17 -->
<div class="text-center w-full mb-xl">
<h1 class="font-title-lg text-title-lg text-primary mb-xs">Welcome to the family, Leo!</h1>
<p class="font-body-default text-body-default text-on-surface-variant max-w-[300px] mx-auto">We're here to help you and your parents every step of the way. Calm nights and happy mornings await.</p>
</div>
<!-- Quick Info Grid - Aligned with Screen 17 cards -->
<div class="w-full grid grid-cols-2 gap-md mb-lg">
<div class="bg-surface rounded-[20px] p-md flex flex-col items-center justify-center gap-sm shadow-ambient border border-surface-container-low h-32">
<div class="w-12 h-12 rounded-full bg-accent-sleep/10 flex items-center justify-center text-accent-sleep">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">bedtime</span>
</div>
<div class="text-center">
<p class="font-caption text-caption text-on-surface-variant">Ready to</p>
<p class="font-body-small font-semibold text-primary">Track Sleep</p>
</div>
</div>
<div class="bg-surface rounded-[20px] p-md flex flex-col items-center justify-center gap-sm shadow-ambient border border-surface-container-low h-32">
<div class="w-12 h-12 rounded-full bg-accent-feed/10 flex items-center justify-center text-accent-feed">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">child_care</span>
</div>
<div class="text-center">
<p class="font-caption text-caption text-on-surface-variant">Ready to</p>
<p class="font-body-small font-semibold text-primary">Log Feeds</p>
</div>
</div>
</div>

<button class="w-full h-14 bg-primary-container text-on-primary rounded-xl font-label-button text-label-button flex items-center justify-center gap-sm active:scale-[0.98] transition-transform shadow-md">

</button>
<p class="font-caption text-caption text-text-tertiary flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">security</span>
            Your data is encrypted and secure
        </p>
</footer>

<div class="fixed inset-0 pointer-events-none opacity-[0.03] mix-blend-multiply bg-[url('https://www.transparenttextures.com/patterns/p6.png')]"></div>
