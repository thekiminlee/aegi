<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

<style>
        /* Ambient base styling for Nurturing Efficiency */
        body {
            background-color: theme('colors.background');
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Soft custom shadow for premium card feel */
        .shadow-ambient {
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.03), 0 2px 8px rgba(0, 0, 0, 0.02);
        }
        
        .shadow-ambient-sm {
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.03);
        }

        /* Material symbol base adjustments */
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="font-body-default text-on-background min-h-[884px] flex flex-col items-center justify-between relative overflow-hidden">
<!-- Decorative Soft Background Element -->
<div class="absolute top-0 left-0 w-full h-96 bg-gradient-to-b from-white to-transparent opacity-60 pointer-events-none z-0"></div>
<!-- Top Safe Area / Step Indicator -->
<header class="w-full max-w-md px-safe-margin pt-xl pb-sm flex items-center justify-between z-10">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full bg-surface shadow-ambient-sm text-on-surface-variant active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[20px]">arrow_back</span>
</button>
<div class="flex gap-2">
<div class="w-8 h-1.5 rounded-full bg-primary-container"></div>
<div class="w-2 h-1.5 rounded-full bg-surface-dim"></div>
<div class="w-2 h-1.5 rounded-full bg-surface-dim"></div>
</div>
<div class="w-10 h-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-md px-safe-margin flex-1 flex flex-col items-center justify-center z-10 w-full mb-8">
<!-- Heading Group -->
<div class="text-center w-full mb-xl">
<h1 class="font-title-lg text-title-lg text-primary mb-xs">Where are you in<br/>your journey?</h1>
<p class="font-body-default text-body-default text-on-surface-variant">We'll tailor Nurture for your needs.</p>
</div>
<!-- Selection Cards (Bento Style Layout) -->
<div class="w-full grid grid-cols-2 gap-md mb-xl">
<!-- Option 1: Unselected -->
<button class="bg-surface rounded-[20px] p-lg flex flex-col items-center justify-center gap-md shadow-ambient border-2 border-transparent active:scale-95 transition-all group relative overflow-hidden h-40">
<div class="w-14 h-14 rounded-full bg-surface-container-low flex items-center justify-center text-on-surface-variant group-hover:bg-accent-sleep/20 transition-colors">
<span class="material-symbols-outlined text-[28px]">pregnant_woman</span>
</div>
<span class="font-section-header text-section-header text-on-surface">Expecting</span>
</button>
<!-- Option 2: Selected State Demo -->
<button class="bg-surface rounded-[20px] p-lg flex flex-col items-center justify-center gap-md shadow-ambient border-2 border-primary-container active:scale-95 transition-all relative overflow-hidden h-40">
<!-- Selection Badge -->
<div class="absolute top-3 right-3 w-6 h-6 rounded-full bg-primary-container flex items-center justify-center text-on-primary">
<span class="material-symbols-outlined text-[14px] fill" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<div class="w-14 h-14 rounded-full bg-primary-container/5 flex items-center justify-center text-primary-container">
<span class="material-symbols-outlined text-[28px]">child_care</span>
</div>
<span class="font-section-header text-section-header text-primary-container">Arrived</span>
</button>
</div>
<!-- Conditional Input Area (Shown because Option 2 is selected) -->
<div class="w-full bg-surface rounded-[20px] p-md shadow-ambient border border-surface-container-low">
<label class="block font-body-small text-body-small text-on-surface-variant mb-sm px-xs">Baby's Birth Date</label>
<!-- Faux Input / Date Picker Trigger -->
<button class="w-full h-[52px] bg-surface-container-lowest border border-outline-variant rounded-xl flex items-center justify-between px-md active:bg-surface-container-lowest/80 transition-colors">
<span class="font-body-default text-body-default text-primary">October 12, 2023</span>
<span class="material-symbols-outlined text-on-surface-variant">calendar_month</span>
</button>
</div>
</main>
<!-- Bottom Action Area -->
<footer class="w-full max-w-md px-safe-margin pb-xl pt-md z-10">
<button class="w-full h-14 bg-primary-container text-on-primary rounded-xl font-label-button text-label-button flex items-center justify-center gap-sm active:scale-[0.98] transition-transform shadow-md">
            Continue
            <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</footer>
